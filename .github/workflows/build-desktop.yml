name: Build Desktop Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            script: bash packaging/build-linux.sh
          - os: macos-latest
            label: macos
            script: bash packaging/build-mac.sh
          - os: windows-latest
            label: windows
            script: bash packaging/build-win.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build desktop bundle
        shell: bash
        run: ${{ matrix.script }}

      - name: Package bundle (tar.gz, preserves macOS symlinks)
        if: matrix.label != 'windows'
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/bslvc-dashboard-${{ matrix.label }}-${{ github.ref_name }}.tar.gz" -C dist .

      - name: Package bundle (zip)
        if: matrix.label == 'windows'
        shell: bash
        run: |
          mkdir -p release
          python -c "import shutil,sys; shutil.make_archive('release/bslvc-dashboard-windows-${{ github.ref_name }}', 'zip', 'dist')"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bslvc-dashboard-${{ matrix.label }}
          path: release/*
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: bslvc-dashboard-*
          merge-multiple: true

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
